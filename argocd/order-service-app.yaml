apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: order-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/muhammad-mansoor9/microservices-learning.git
    targetRevision: scenario-3
    path: helm/order-service
    helm:
      valueFiles:
        - ../../helm/values-prod.yaml
      valuesObject:
        image:
          repository: 311902596266.dkr.ecr.us-east-1.amazonaws.com/ms-learning/order-service
        irsa:
          roleArn: arn:aws:iam::311902596266:role/ms-learning-eks-order-service
        env:
          DB_URL: jdbc:postgresql://postgres.default.svc.cluster.local:5432/order_db
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          USER_SERVICE_URL: http://user-service.default.svc.cluster.local:8080
          PAYMENT_SERVICE_URL: http://payment-service.default.svc.cluster.local:8080
          AWS_REGION: us-east-1
          SQS_ORDER_EVENTS_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/311902596266/order-events
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
