apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "payment-service.fullname" . }}
  labels:
    {{- include "payment-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "payment-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "payment-service.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "payment-service.serviceAccountName" . }}
      volumes:
        - name: otel-agent
          emptyDir: {}
      initContainers:
        - name: otel-agent-downloader
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - |
              set -eu
              curl -fsSL -o /agents/opentelemetry-agent.jar \
                "{{ include "payment-service.otelAgentUrl" . }}"
          volumeMounts:
            - name: otel-agent
              mountPath: /agents
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/agents/opentelemetry-agent.jar"
            - name: OTEL_SERVICE_NAME
              value: {{ include "payment-service.name" . | quote }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: otel-agent
              mountPath: /agents
              readOnly: true
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
