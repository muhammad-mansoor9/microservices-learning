{{- if .Values.autoscaling.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "payment-service.fullname" . }}-scaler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "payment-service.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "payment-service.fullname" . }}
  minReplicaCount: {{ .Values.autoscaling.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.autoscaling.keda.maxReplicaCount }}
  cooldownPeriod: {{ .Values.autoscaling.keda.cooldownPeriod }}
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: {{ include "payment-service.fullname" . }}-aws
      metadata:
        queueURL: {{ .Values.sqs.queueUrl | quote }}
        queueLength: {{ .Values.autoscaling.keda.queueLength | quote }}
        awsRegion: {{ .Values.aws.region | quote }}
        identityOwner: pod
{{- end }}
