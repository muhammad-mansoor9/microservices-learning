# Replace FLUENTBIT_ROLE_ARN with the value of
#   terraform -chdir=infrastructure/scenario-3 output -raw fluentbit_role_arn
# (or apply this file through scripts/setup-cluster.sh which interpolates
# the value from Terraform output at apply time).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentbit
  namespace: amazon-cloudwatch
  annotations:
    eks.amazonaws.com/role-arn: FLUENTBIT_ROLE_ARN
