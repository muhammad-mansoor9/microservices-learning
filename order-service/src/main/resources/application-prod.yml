spring:
  config:
    import: "aws-parameterstore:/ms-learning/"
  datasource:
    url: ${order.db-url}
    username: ${order.db-username}
    password: ${order.db-password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      # Learning-mode: Hibernate creates missing tables on first boot.
      # For a real prod system, swap to `validate` and manage schema
      # via Flyway/Liquibase migrations.
      ddl-auto: update

services:
  user-service-url: ${user.url}
  payment-service-url: ${payment.url}
  saga-state-machine-arn: ${order.saga-state-machine-arn}
  internal-api-key: ${order.internal-api-key}

aws:
  region: us-east-1

management:
  endpoint:
    health:
      show-details: when-authorized
