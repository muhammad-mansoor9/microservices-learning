server:
  # ECS task definition + ALB target group both use 8080 for every service.
  # The 8082 default in the parent application.yml is for docker-compose
  # host-port disambiguation only.
  port: 8080
spring:
  config:
    import: "aws-parameterstore:/ms-learning/"
  datasource:
    url: ${payment.db-url}
    username: ${payment.db-username}
    password: ${payment.db-password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Learning-mode: Hibernate creates missing tables on first boot.
      # For a real prod system, swap to `validate` and manage schema
      # via Flyway/Liquibase migrations.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
