server:
  port: 8082
spring:
  config:
    import: "aws-parameterstore:/ms-learning/"
  datasource:
    url: ${/ms-learning/payment/db-url}
    username: ${/ms-learning/payment/db-username}
    password: ${/ms-learning/payment/db-password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
