server:
  port: 8082
spring:
  config:
    import: "aws-parameterstore:/ms-learning/"
  datasource:
    url: ${payment.db-url}
    username: ${payment.db-username}
    password: ${payment.db-password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
