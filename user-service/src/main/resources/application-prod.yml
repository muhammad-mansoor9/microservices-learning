server:
  port: 8083
spring:
  config:
    import: "aws-parameterstore:/ms-learning/"
aws:
  region: us-east-1
  endpoint-override: ""
  dynamodb:
    table-name: ${user.dynamodb-table:users}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
