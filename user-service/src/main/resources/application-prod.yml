server:
  # ECS task definition + ALB target group both use 8080 for every service.
  # The 8083 default in the parent application.yml is for docker-compose
  # host-port disambiguation only.
  port: 8080
spring:
  config:
    import: "aws-parameterstore:/ms-learning/"
aws:
  region: us-east-1
  endpoint-override: ""
  dynamodb:
    table-name: ${user.dynamodb-table:users}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
